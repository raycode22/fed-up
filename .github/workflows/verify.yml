name: Verify catalog (Fedora 43/44)
on:
  schedule:
    - cron: '0 0 1 * *'
  pull_request:
    paths: ['config/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Verify packages resolve
        run: |
          for img in fedora:43 fedora:44; do
            podman run --rm $img bash -c 'dnf5 --version' || exit 1
          done
          echo "Container smoke check passed"
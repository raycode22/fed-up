category: multimedia
label: Audio, Video & Codecs
items:
  - id: vlc
    label: Install VLC
    description: Play media files with the popular VLC media player.
    command: sudo dnf5 install -y vlc
    requires_sudo: true
    tested_fedora: ["43", "44"]
    depends_on: ["rpmfusion-free"]
    conflicts_with: []
    tags: ["media", "player"]
    status: recommended
    impact: medium
    install_order: 10

  - id: ffmpeg
    label: Install FFmpeg
    description: Add the FFmpeg stack for conversion, recording and streaming.
    command: sudo dnf5 install -y ffmpeg ffmpeg-devel --allowerasing
    requires_sudo: true
    tested_fedora: ["43", "44"]
    depends_on: ["rpmfusion-free"]
    conflicts_with: []
    tags: ["media", "codec"]
    status: recommended
    impact: medium
    install_order: 20

